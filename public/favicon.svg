<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Blueprint Slate Plate -->
  <rect width="128" height="128" rx="8" fill="#06090f" />
  <rect x="6" y="6" width="116" height="116" rx="4" stroke="#1e293b" stroke-width="2" fill="#090d16" />

  <!-- Micro-grid lines -->
  <line x1="6" y1="35" x2="122" y2="35" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="6" y1="64" x2="122" y2="64" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="6" y1="93" x2="122" y2="93" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="35" y1="6" x2="35" y2="122" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="64" y1="6" x2="64" y2="122" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="93" y1="6" x2="93" y2="122" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Corner Crosshair Ticks -->
  <path d="M6 14 H16 M14 6 V16 M122 14 H112 M114 6 V16 M6 114 H16 M14 122 V112 M122 114 H112 M114 122 V112" stroke="#38bdf8" stroke-width="1.5" />

  <!-- CAD Prompt '>' Glyph -->
  <path d="M26 44 L44 64 L26 84" stroke="#38bdf8" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Monogram 'M' Blueprint Glyph -->
  <path d="M54 84 V44 L75 67 L96 44 V84" stroke="#f8fafc" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Technical Node Dot -->
  <circle cx="106" cy="84" r="3" fill="#38bdf8" />
</svg>
