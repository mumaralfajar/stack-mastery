name: Verify Curriculum

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/tracks/**'
      - 'src/data/interview*.js'
      - 'tools/verify*.mjs'
      - '.github/workflows/verify-curriculum.yml'

permissions:
  contents: read

concurrency:
  group: verify-curriculum-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-dotnet:
    name: Verify C# & ASP.NET Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: bun install --frozen-lockfile
      - run: bun run verify:cs
      - run: bun run verify:aspnet

  verify-go:
    name: Verify Go & System Design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: bun install --frozen-lockfile
      - run: bun run verify:go
      - run: bun run verify:sysdesign

  verify-web:
    name: Verify CSS, React & Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Ensure Chrome/Chromium for CSS verification
        run: command -v google-chrome || npx --yes playwright install --with-deps chromium
      - run: bun run verify:css
      - run: bun run verify:react
      - run: bun run verify:angular

  verify-dart:
    name: Verify Dart & Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bun install --frozen-lockfile
      - run: bun run verify:dart

  verify-sql:
    name: Verify SQL Server samples
    runs-on: ubuntu-latest
    env:
      MSSQL_SA_PASSWORD: 'Verify!Pass2026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Start SQL Server 2022 container
        run: |
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 45); do
            if docker exec mssql sh -c 'BIN=$(command -v sqlcmd || echo /opt/mssql-tools18/bin/sqlcmd); [ -x "$BIN" ] || BIN=/opt/mssql-tools/bin/sqlcmd; "$BIN" -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"' >/dev/null 2>&1; then
              echo "SQL Server ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          docker logs mssql
          exit 1
      - name: Run SQL verifier
        run: node tools/verify-sql.mjs --docker mssql --user sa
      - name: Stop container
        if: always()
        run: docker rm -f mssql || true
