name: CI

# Quality gates for every pull request into main. The three job names below are the
# required status checks on main, so keep them stable: "Quality & Build",
# "Playwright UI & a11y" and "Conventional PR".
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Type check (astro check)
        run: bun run typecheck

      - name: Verify i18n translations
        run: bun run check:i18n

      - name: Build Astro site
        run: bun run build:timings

  playwright-ui-a11y:
    name: Playwright UI & a11y
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro site
        run: bun run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium
        run: pip install playwright && playwright install --with-deps chromium

      - name: Run UI, i18n, layout and axe-core WCAG 2.2 AA suite
        run: python -u tools/verify-ui.py

  conventional-pr:
    name: Conventional PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR title follows Conventional Commits v1.0.0
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

      - name: Commit messages follow Conventional Commits v1.0.0
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [ "$EVENT" = "pull_request" ]; then
            range=("$PR_BASE..$PR_HEAD")
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range=("$PUSH_BEFORE..$PUSH_AFTER")
          else
            range=(-1 "$PUSH_AFTER")
          fi
          # Merge commits written by GitHub ("Merge pull request #N ...") are exempt; every authored commit is checked.
          mapfile -t commits < <(git log --no-merges --format='%h%x09%s' "${range[@]}")
          if [ "${#commits[@]}" -eq 0 ]; then
            echo "No authored (non-merge) commits in ${range[*]}; nothing to check."
            exit 0
          fi
          bad=0
          for line in "${commits[@]}"; do
            subject="${line#*$'\t'}"
            if printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "ok   $line"
            else
              echo "::error title=Non-conventional commit::$line"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Commit subjects must match: type(optional-scope)!: description (Conventional Commits v1.0.0)."
            exit 1
          fi
          echo "All ${#commits[@]} commit(s) follow Conventional Commits v1.0.0."
